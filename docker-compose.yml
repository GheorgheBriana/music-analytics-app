version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: music-analytics-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  db_eu:
    image: postgres:15-alpine
    container_name: music-analytics-db-eu
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_analytics_eu
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_eu:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_data_eu:
